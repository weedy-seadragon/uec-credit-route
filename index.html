<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- ブラウザのタブやスマホのショートカットに表示するサイトアイコン。 -->
    <link rel="icon" type="image/png" href="/site-icon.png" />
    <link rel="apple-touch-icon" href="/site-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>電通大 単位取得ルートナビ(Ver.1.0.0)</title>
    <meta
      name="description"
      content="電気通信大学の卒業要件・取得単位・残りの必修科目を確認できる非公式サイトです。"
    />

    <!-- SNSやチャットに公開URLを貼ったときに表示されるリンクカードの情報。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="電通大 単位取得ルートナビ" />
    <meta property="og:title" content="電通大 単位取得ルートナビ Ver.1.0.0" />
    <meta
      property="og:description"
      content="卒業要件・取得単位・残りの必修科目を、プロフィールに合わせて確認できます。"
    />
    <meta property="og:url" content="https://weedy-seadragon.github.io/uec-credit-route/" />
    <!-- 共有カードでは、透過を含まないアイコン画像を小さなサムネイルとして表示する。 -->
    <meta property="og:image" content="https://weedy-seadragon.github.io/uec-credit-route/social-icon.png?v=1" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="電通大 単位取得ルートナビのサイトアイコン" />

    <!-- X（旧Twitter）では、アイコン付きのコンパクトなカードとして表示する。 -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="電通大 単位取得ルートナビ Ver.1.0.0" />
    <meta
      name="twitter:description"
      content="卒業要件・取得単位・残りの必修科目を、プロフィールに合わせて確認できます。"
    />
    <meta name="twitter:image" content="https://weedy-seadragon.github.io/uec-credit-route/social-icon.png?v=1" />
    <meta name="twitter:image:alt" content="電通大 単位取得ルートナビのサイトアイコン" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
